version = 1
SPDX-PackageName = "external-arbiter-operator"
SPDX-PackageSupplier = "cobaltcore-dev authors <ospo@sap.com>"
SPDX-PackageDownloadLocation = "https://github.com/cobaltcore-dev/external-arbiter-operator"

[[annotations]]
path = [
    ".github/**",
    ".gitignore",
    ".golangci.yml",
    ".dockerignore",
    ".helmignore",
    "*.tpl",
    "Makefile",
    "README.md",
    "cmd/**",
    "go.mod",
    "go.sum",
    "pkg/**",
    "docs/**",
    "REUSE.toml"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 SAP SE or an SAP affiliate company and cobaltcore-dev contributors"
SPDX-License-Identifier = "Apache-2.0"

# Vendored, unmodified Rook CRD manifest (deploy/examples/crds.yaml at tag
# v1.18.6), committed so CI needs no network to run CRD/envtest checks.
[[annotations]]
path = ["contrib/k8s/3rdparty/rook.yaml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Rook Authors"
SPDX-License-Identifier = "Apache-2.0"
