---
imagePullSecrets: []

manager:
  image:
    repository: localhost:5000/cobaltcore-dev/external-arbiter-operator
    pullPolicy: Never
    tag: "latest"
  resources:
    # The manager runs cluster-wide informers for secrets, configmaps and
    # deployments and builds a fresh remote-cluster client (TLS handshakes)
    # per reconcile; 100m/30Mi Guaranteed-QoS caps starve the healthz/readyz
    # handlers under watch-event bursts (e.g. rook RGW orchestration).
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

metricsService:
  type: ClusterIP
  port: 8443

webhookService:
  type: ClusterIP
  port: 443

useNetworkPolicies: false
useCertManager: true
useMonitoring: false

cluster:
  domain: cluster.local

leaderElection:
  leaderElect: true
  resourceName: ecaf1259.cobaltcore.sap.com