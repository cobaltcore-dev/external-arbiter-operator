# CephCluster for the quorum-survival e2e harness.
# mon.count: 3 → with the arbiter mon that is 4 mons total. Killing one source
# mon leaves 3/4 = majority, so quorum survives *because* the arbiter votes.
# OSDs are backed by loopback Block PVCs on k3d's local-path StorageClass — no
# real disk needed. See docs/superpowers/specs/2026-09-03-quorum-survival-harness-design.md
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: my-cluster
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18   # reef, pairs with Rook 1.18
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 1
  dashboard:
    enabled: false
  crashCollector:
    disable: true
  storage:
    storageClassDeviceSets:
      - name: set1
        count: 2
        portable: false
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              resources:
                requests:
                  storage: 5Gi
              storageClassName: local-path
              volumeMode: Block
              accessModes:
                - ReadWriteOnce
  resources:
    mon:
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { memory: "1Gi" }
    mgr:
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { memory: "1Gi" }
    osd:
      requests: { cpu: "100m", memory: "1Gi" }
      limits: { memory: "2Gi" }
