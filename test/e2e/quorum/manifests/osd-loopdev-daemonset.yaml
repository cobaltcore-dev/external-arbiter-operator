# Attaches a raw loop-backed block device to every node so Rook's useAllDevices
# has something to make an OSD from — k3d nodes have no spare real disk and the
# local-path StorageClass can't serve volumeMode: Block.
#
# Privileged DaemonSet: create a sparse backing file on the node, losetup it,
# then sleep forever (the loop device must stay attached while Rook prepares and
# runs the OSD). Idempotent: reuses an existing loop for the same backing file.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: osd-loopdev
  namespace: rook-ceph
  labels:
    app: osd-loopdev
spec:
  selector:
    matchLabels:
      app: osd-loopdev
  template:
    metadata:
      labels:
        app: osd-loopdev
    spec:
      hostPID: true
      containers:
        - name: loopdev
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              BACKING=/mnt/osd-data/ceph-osd.img
              mkdir -p /mnt/osd-data
              if [ ! -f "$BACKING" ]; then
                # 8Gi sparse file — enough for a single test OSD.
                truncate -s 8G "$BACKING"
              fi
              # Reuse an existing association for this file, else attach a new one.
              DEV=$(losetup -j "$BACKING" | cut -d: -f1)
              if [ -z "$DEV" ]; then
                DEV=$(losetup -f)
                losetup "$DEV" "$BACKING"
              fi
              echo "loop device $DEV backed by $BACKING ready"
              # Hold the association open for the life of the cluster.
              sleep infinity
          volumeMounts:
            - name: osd-data
              mountPath: /mnt/osd-data
            - name: dev
              mountPath: /dev
      volumes:
        # Persist the backing file on the node so a pod restart reuses it.
        - name: osd-data
          hostPath:
            path: /var/lib/rook-osd-loop
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: /dev
